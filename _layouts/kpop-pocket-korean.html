<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy and usage information for K-pop Pocket Korean">
  <title>{{ page.title | escape }} | K-pop Pocket Korean</title>
  <style>
    :root { color-scheme: light; color: #292334; background: #fcf9ff; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.7; }
    header, main, footer { width: min(100% - 32px, 800px); margin: auto; }
    header { padding: 24px 0; border-bottom: 1px solid #ded4ea; }
    .brand { font-size: 1.3rem; font-weight: 750; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 12px; }
    main { padding: 28px 0 40px; overflow-wrap: anywhere; }
    h1, h2, h3 { line-height: 1.35; }
    h1 { font-size: 1.9rem; } h2 { font-size: 1.35rem; margin-top: 32px; }
    a { color: #63488a; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #9071b7; outline-offset: 4px; }
    footer { padding: 20px 0 32px; border-top: 1px solid #ded4ea; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">K-pop Pocket Korean</div>
    <nav aria-label="Policy pages">
      <a href="{{ '/kpop-pocket-korean/privacy/' | relative_url }}">Privacy policy</a>
      <a href="{{ '/kpop-pocket-korean/notices/' | relative_url }}">Usage &amp; content notices</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>K-pop Pocket Korean · Contact: <a href="mailto:davidleepub@gmail.com">davidleepub@gmail.com</a></footer>
</body>
</html>
