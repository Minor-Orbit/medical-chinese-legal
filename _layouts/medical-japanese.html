<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="医療日本語－病院コーディネーター・通訳練習の公開ポリシー">
    <title>{{ page.title }} | 医療日本語</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #24292f;
        --muted: #57606a;
        --border: #d0d7de;
        --link: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0d1117;
          --foreground: #e6edf3;
          --muted: #8b949e;
          --border: #30363d;
          --link: #58a6ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", sans-serif;
        font-size: 16px;
        line-height: 1.75;
      }
      .site-header { border-bottom: 1px solid var(--border); }
      .site-title,
      main,
      footer {
        width: min(100% - 40px, 860px);
        margin-inline: auto;
      }
      .site-title {
        padding: 18px 0;
        font-size: 1.35rem;
        font-weight: 700;
      }
      main { padding: 28px 0 48px; }
      footer {
        border-top: 1px solid var(--border);
        padding: 18px 0 32px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      h1, h2 { line-height: 1.35; }
      h1 { margin: 0 0 1.25rem; font-size: 2rem; }
      h2 { margin-top: 2rem; font-size: 1.35rem; }
      a { color: var(--link); }
      code { overflow-wrap: anywhere; }
      @media (max-width: 520px) {
        .site-title, main, footer { width: min(100% - 28px, 860px); }
        h1 { font-size: 1.65rem; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-title">医療日本語</div>
    </header>
    <main>{{ content }}</main>
    <footer>Minor Orbit · 医療日本語－病院コーディネーター・通訳練習</footer>
  </body>
</html>
